[project]
name = "roxy-pipeline"
version = "0.1.0"
description = "AI explainer video pipeline: script, storyboard, TTS, deterministic rendering, QC"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.30.0",
    "celery[redis]>=5.4.0",
    "fastapi>=0.115.0",
    "imageio-ffmpeg>=0.5.1",
    "jinja2>=3.1.4",
    "pillow>=10.4.0",
    "playwright==1.59.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "scipy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
