[project]
name = "roxy-pipeline"
version = "0.1.0"
description = "AI explainer video pipeline: script, storyboard, TTS, deterministic rendering, QC"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.5.1",
    "jinja2>=3.1.4",
    "pillow>=10.4.0",
    "playwright==1.59.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
